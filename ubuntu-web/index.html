<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狼人殺 · Werewolf Online</title>
  <!-- v=4：cache-busting，讓 Cloudflare 邊緣快取失效、拿到最新 CSS/JS -->
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

  <!-- 背景裝飾（v6 村莊夜景）：星空、月亮、飄雲、遠山、村落剪影 -->
  <div class="sky" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <svg class="village-svg" viewBox="0 0 1400 360" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="winGlow" cx="50%" cy="45%" r="65%">
          <stop offset="0%" stop-color="#ffedbe"/>
          <stop offset="55%" stop-color="#ffc864"/>
          <stop offset="100%" stop-color="#a86e1c"/>
        </radialGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffc864" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#ffc864" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="pool" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffc864" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#ffc864" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="lamp-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffca7a" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#ffca7a" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 遠山 -->
      <path d="M0,300 L120,210 L210,250 L330,190 L430,245 L560,200 L680,252 L800,195 L920,248 L1050,205 L1180,250 L1300,215 L1400,248 L1400,360 L0,360 Z" fill="#1b2440" opacity="0.85"/>
      <path d="M0,310 L90,245 L200,280 L340,235 L470,285 L620,240 L760,288 L900,242 L1040,286 L1190,244 L1320,282 L1400,255 L1400,360 L0,360 Z" fill="#131a32" opacity="0.9"/>
      <g fill="#ffc864">
        <circle cx="345" cy="262" r="1.6" opacity="0.5"/>
        <circle cx="905" cy="268" r="1.6" opacity="0.45"/>
        <circle cx="1062" cy="258" r="1.4" opacity="0.4"/>
      </g>

      <!-- 後山丘 -->
      <path d="M0,310 Q220,288 450,302 T900,298 T1400,304 L1400,360 L0,360 Z" fill="#0c1220"/>

      <!-- 左村落（後排先畫，前排蓋上去） -->
      <g fill="#0b101e">
        <rect x="160" y="228" width="95" height="110" rx="2"/>
        <polygon points="150,228 207,168 265,228"/>
        <polygon points="150,228 265,228 268,233 147,233" fill="#080c14"/>
      </g>
      <rect x="213" y="241" width="38" height="42" rx="8" fill="url(#halo)"/>
      <rect x="220" y="248" width="24" height="28" rx="3" fill="url(#winGlow)" opacity="0.55"/>

      <g fill="#0a0e18">
        <rect x="70" y="215" width="110" height="125" rx="2"/>
        <polygon points="58,215 125,148 192,215"/>
        <polygon points="58,215 192,215 195,220 55,220" fill="#080c14"/>
        <line x1="192" y1="215" x2="127" y2="150" stroke="#4a588f" stroke-width="2" opacity="0.5"/>
        <rect x="150" y="168" width="12" height="52"/>
        <rect x="146" y="164" width="20" height="6" rx="2"/>
        <circle cx="125" cy="192" r="16" fill="url(#halo)"/>
        <circle cx="125" cy="192" r="9" fill="url(#winGlow)" opacity="0.9"/>
        <rect x="85" y="226" width="40" height="44" rx="8" fill="url(#halo)"/>
        <rect x="92" y="233" width="26" height="30" rx="3" fill="url(#winGlow)" opacity="0.85"/>
        <rect x="133" y="226" width="40" height="44" rx="8" fill="url(#halo)"/>
        <rect x="140" y="233" width="26" height="30" rx="3" fill="url(#winGlow)" opacity="0.6"/>
      </g>
      <ellipse cx="125" cy="322" rx="62" ry="10" fill="url(#pool)"/>

      <!-- 左松樹 x2（前景，打破屋頂線） -->
      <g fill="#060a12">
        <polygon points="252,340 274,240 296,340"/>
        <polygon points="256,282 274,214 292,282"/>
        <polygon points="261,244 274,188 287,244"/>
        <rect x="271" y="336" width="6" height="16"/>
        <polygon points="310,340 326,262 342,340"/>
        <polygon points="313,296 326,236 339,296"/>
        <polygon points="317,262 326,216 335,262"/>
        <rect x="323" y="336" width="6" height="14"/>
      </g>

      <!-- 右村落 -->
      <g fill="#0a0e18">
        <rect x="985" y="225" width="90" height="115" rx="2"/>
        <polygon points="973,225 1030,163 1087,225"/>
        <polygon points="973,225 1087,225 1090,230 970,230" fill="#080c14"/>
        <rect x="1050" y="183" width="12" height="48"/>
        <rect x="1046" y="179" width="20" height="6" rx="2"/>
        <circle cx="1030" cy="205" r="14" fill="url(#halo)"/>
        <circle cx="1030" cy="205" r="8" fill="url(#winGlow)" opacity="0.9"/>
        <rect x="993" y="236" width="38" height="42" rx="8" fill="url(#halo)"/>
        <rect x="1000" y="243" width="24" height="28" rx="3" fill="url(#winGlow)" opacity="0.85"/>
      </g>
      <ellipse cx="1025" cy="322" rx="55" ry="10" fill="url(#pool)"/>

      <!-- 教堂 -->
      <g fill="#0a0e18">
        <rect x="1095" y="210" width="60" height="130" rx="2"/>
        <polygon points="1085,210 1125,122 1165,210"/>
        <polygon points="1085,210 1165,210 1168,215 1082,215" fill="#080c14"/>
        <line x1="1165" y1="210" x2="1127" y2="126" stroke="#4a588f" stroke-width="2" opacity="0.5"/>
        <rect x="1122" y="102" width="5" height="22" fill="#0a0e18"/>
        <rect x="1116" y="109" width="17" height="5" fill="#0a0e18"/>
        <circle cx="1125" cy="182" r="16" fill="url(#halo)"/>
        <circle cx="1125" cy="182" r="10" fill="url(#winGlow)" opacity="0.9"/>
        <circle cx="1125" cy="182" r="10" fill="none" stroke="#0a0e18" stroke-width="2.5"/>
        <line x1="1125" y1="172" x2="1125" y2="192" stroke="#0a0e18" stroke-width="2"/>
        <line x1="1115" y1="182" x2="1135" y2="182" stroke="#0a0e18" stroke-width="2"/>
        <circle cx="1125" cy="182" r="2" fill="#0a0e18"/>
        <path d="M1115,260 L1115,232 Q1125,220 1135,232 L1135,260 Z" fill="url(#winGlow)" opacity="0.85"/>
      </g>

      <!-- R2 右小屋 -->
      <g fill="#0b101e">
        <rect x="1175" y="235" width="85" height="105" rx="2"/>
        <polygon points="1165,235 1217,178 1270,235"/>
        <polygon points="1165,235 1270,235 1273,240 1162,240" fill="#080c14"/>
        <line x1="1270" y1="235" x2="1219" y2="180" stroke="#4a588f" stroke-width="2" opacity="0.45"/>
        <rect x="1188" y="244" width="36" height="40" rx="8" fill="url(#halo)"/>
        <rect x="1195" y="251" width="22" height="26" rx="3" fill="url(#winGlow)" opacity="0.7"/>
      </g>

      <!-- 右松樹 -->
      <g fill="#060a12">
        <polygon points="1282,340 1302,238 1322,340"/>
        <polygon points="1286,280 1302,212 1318,280"/>
        <polygon points="1291,240 1302,192 1313,240"/>
        <rect x="1299" y="336" width="6" height="16"/>
      </g>

      <!-- 前景地面（最後畫，吞掉所有牆根，杜絕浮空） -->
      <path d="M0,300 Q200,292 420,300 T840,298 T1400,301 L1400,360 L0,360 Z" fill="#05080f"/>

      <!-- 路燈 -->
      <g>
        <ellipse cx="940" cy="318" rx="46" ry="10" fill="url(#pool)"/>
        <circle cx="940" cy="248" r="34" fill="url(#lamp-halo)"/>
        <rect x="937" y="258" width="6" height="82" fill="#04070d"/>
        <rect x="928" y="336" width="24" height="6" rx="2" fill="#04070d"/>
        <rect x="931" y="238" width="18" height="22" rx="4" fill="#04070d"/>
        <rect x="935" y="242" width="10" height="14" rx="2" fill="#ffca7a"/>
        <polygon points="929,238 940,228 951,238" fill="#04070d"/>
      </g>

      <!-- 前景灌木 -->
      <g fill="#030509">
        <ellipse cx="20" cy="340" rx="52" ry="22"/>
        <ellipse cx="100" cy="344" rx="38" ry="18"/>
        <ellipse cx="700" cy="343" rx="34" ry="16"/>
        <ellipse cx="1330" cy="340" rx="56" ry="22"/>
        <ellipse cx="1400" cy="344" rx="34" ry="17"/>
      </g>

      <!-- 蝙蝠 -->
      <g stroke="#04070d" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path class="bat" d="M1050,90 Q1056,84 1062,90 Q1068,84 1074,90"/>
        <path class="bat" style="animation-delay:-3s" d="M1120,130 Q1125,125 1130,130 Q1135,125 1140,130"/>
        <path class="bat" style="animation-delay:-6s" d="M1000,140 Q1004,136 1008,140 Q1012,136 1016,140"/>
      </g>
    </svg>
  </div>

  <!-- ==================== 首頁 ==================== -->
  <main class="page" id="page-home">
    <header class="home-header">
      <h1 class="title">狼人殺</h1>
      <p class="subtitle">Werewolf Online</p>
      <div class="divider"><i></i><span>🌙</span><i></i></div>
    </header>

    <div class="home-cards">
      <!-- 進入房間：統一暱稱＋建立／加入按鈕。
           「加入房間」第一次點擊時，4 位代碼輸入框會取代「建立房間」按鈕的位置出現，
           第二次點擊「加入房間」才送出 -->
      <section class="card">
        <h2>進入房間</h2>
        <div class="field">
          <label for="nick">暱稱</label>
          <input type="text" id="nick" maxlength="12"
                 placeholder="輸入你的暱稱" autocomplete="off">
        </div>
        <div class="entry-actions">
          <button class="btn btn-primary" id="btn-create">建立房間</button>
          <div class="join-code-slot" id="join-code-slot" hidden>
            <input type="text" id="join-code" maxlength="4" inputmode="numeric"
                   placeholder="4 位代碼" class="code-input"
                   autocomplete="off" aria-label="房間代碼">
            <!-- 取消加入：代碼框右側的小 ✕，點擊返回初始畫面 -->
            <button type="button" class="btn btn-ghost" id="btn-cancel-join" hidden
                    title="取消" aria-label="取消加入，返回初始畫面">✕</button>
          </div>
          <button class="btn btn-primary" id="btn-join">加入房間</button>
        </div>
        <p class="demo-hint">小密語：代碼 <code>9999</code> 可體驗「房間已滿」</p>
      </section>
    </div>

    <footer class="home-footer">v0.1 · 前端畫面原型</footer>
  </main>

  <!-- ==================== 房間 / Lobby ==================== -->
  <main class="page" id="page-room">
    <!-- 頂欄 -->
    <header class="room-topbar">
      <div class="room-code">
        <span class="label">房間代號</span>
        <span class="code" id="room-code">------</span>
      </div>
      <div class="room-meta">
        <!-- 身分切換：參戰／觀戰 -->
        <div class="mode-toggle" role="group" aria-label="身分切換">
          <button type="button" class="mode-btn" id="mode-play">⚔ 參戰</button>
          <button type="button" class="mode-btn" id="mode-spec">👀 觀戰</button>
        </div>
        <span class="player-count"><b id="player-count">0</b> / <span id="player-max">15</span></span>
        <button class="btn btn-ghost btn-leave" id="btn-leave">離開</button>
      </div>
    </header>

    <div class="room-grid">
      <!-- 左：玩家列表 -->
      <aside class="panel panel-players">
        <h3>🐺 玩家</h3>
        <ul class="player-list" id="player-list"></ul>
      </aside>

      <!-- 中：聊天 -->
      <section class="panel panel-chat">
        <h3>💬 聊天</h3>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
          <input type="text" id="chat-text" maxlength="200"
                 placeholder="說點什麼…" autocomplete="off">
          <button class="btn btn-primary" id="btn-send">發送</button>
        </div>
      </section>

      <!-- 右：房主設定 -->
      <aside class="panel panel-settings">
        <h3>⚙ 房間設定</h3>

        <!-- 房主工具（只有房主看到） -->
        <div class="settings-body" id="host-tools">
          <div class="setting">
            <label for="max-players">玩家人數</label>
            <div class="setting-row">
              <input type="range" id="max-players" min="6" max="15" step="1" value="15">
              <span class="range-value" id="max-players-value">15</span>
            </div>
            <div class="setting-row">
              <label class="switch">
                <input type="checkbox" id="random-count">
                <span class="switch-track" aria-hidden="true"></span>
                <span class="switch-text">隨機</span>
              </label>
            </div>
            <p class="random-hint" id="random-hint" hidden>開局時在 6–上限 間隨機決定實際人數</p>
          </div>
          <button class="btn btn-start" id="btn-start">開始遊戲</button>
          <p class="hint">只有房主可以調整人數上限、開始遊戲與移出玩家。</p>
        </div>

        <!-- 非房主：等待中 -->
        <div class="note-box" id="waiting-note" hidden>
          <span>⏳ 等待房主開始遊戲<br>人齊後房主會按下「開始遊戲」</span>
        </div>

        <!-- 觀戰中 -->
        <div class="note-box" id="spectate-note" hidden>
          <span>👁 你正在以觀戰身份觀看<br>無法發言與操作</span>
        </div>
      </aside>
    </div>
  </main>

  <!-- ==================== 過渡：加入房間中 ==================== -->
  <div class="overlay" id="overlay-loading" hidden>
    <div class="overlay-box">
      <div class="spinner"></div>
      <p>加入房間中…</p>
    </div>
  </div>

  <!-- ==================== 過渡：房間已滿 ==================== -->
  <div class="overlay" id="overlay-full" hidden>
    <div class="overlay-box">
      <p class="overlay-title">房間已滿</p>
      <p>是否以觀戰身份進入？</p>
      <div class="overlay-actions">
        <button class="btn btn-primary" id="btn-spectate">以觀戰進入</button>
        <button class="btn btn-ghost" id="btn-cancel">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=11"></script>
</body>
</html>
