<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人狼遊戲（全 AI 對戰）</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <h1>人狼遊戲（全 AI 對戰）</h1>
  <div id="statusbar">
    <span id="day-label">第 - 天</span>
    <span id="phase-label">連線中…</span>
    <span id="conn-label">連線中…</span>
  </div>
  <div id="header-buttons">
    <button id="gm-toggle" type="button">GM 檢視：關</button>
    <button id="leave-btn" type="button">離開</button>
  </div>
</header>
<main>
  <section id="board" aria-label="白板"></section>
  <aside>
    <section id="players" aria-label="玩家列表"></section>
    <section id="controls" aria-label="動作區（Phase 2 預留）">
      <h2>動作</h2>
      <div>
        <input id="speak-input" type="text" placeholder="發言…" disabled>
        <button id="speak-btn" type="button" disabled>發言</button>
      </div>
      <div>
        <button id="skip-btn" type="button" disabled>跳過 / 準備投票</button>
      </div>
      <div>
        <input id="vote-input" type="text" placeholder="投票目標 P編號" disabled>
        <button id="vote-btn" type="button" disabled>投票</button>
      </div>
      <div>
        <input id="night-input" type="text" placeholder="夜間目標 P編號" disabled>
        <button id="night-btn" type="button" disabled>夜間行動</button>
      </div>
    </section>
  </aside>
</main>
<div id="disconnect-overlay" hidden>
  <div>
    <p id="disconnect-text">與伺服器斷線，重新連線中…</p>
  </div>
</div>
<script src="/js/main.js"></script>
</body>
</html>
