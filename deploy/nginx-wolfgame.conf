# nginx-wolfgame.conf
# 部署路徑：/etc/nginx/sites-available/wolfgame.conf
# 啟用：ln -s /etc/nginx/sites-available/wolfgame.conf /etc/nginx/sites-enabled/
#
# 將 /wolfgame/ 全部 proxy 到本機 Node.js lobby-server（port 2640）。
# Node.js server 自己伺服靜態檔案（ubuntu-web/）+ WebSocket，nginx 只做反代。
#
# 前置：cloudflared tunnel 已將 morowin.win 流量導到本機 :80（現有設定不變）。

server {
    listen 80;
    server_name morowin.win;

    # 人狼遊戲 lobby server
    location /wolfgame/ {
        proxy_pass http://127.0.0.1:2640/;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 真實 IP（lobby-server 用 x-forwarded-for 做 rate limit）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # WS 長連線：不要 buffer、放長超時
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 根路徑導向（方便直接打 morowin.win 跳轉）
    location = / {
        return 302 /wolfgame/;
    }
}
