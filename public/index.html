<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人狼遊戲（真人 + AI 混合對戰）</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <h1>人狼遊戲（真人 + AI 混合對戰）</h1>
  <div id="statusbar">
    <span id="day-label">第 - 天</span>
    <span id="phase-label">連線中…</span>
    <span id="conn-label">連線中…</span>
  </div>
  <div id="header-buttons">
    <button id="gm-toggle" type="button" hidden>GM 檢視：關</button>
    <button id="leave-btn" type="button">離開</button>
  </div>
</header>
<main>
  <section id="board" aria-label="白板"></section>
  <aside>
    <section id="players" aria-label="玩家列表"></section>
    <section id="me" aria-label="我的身分" hidden></section>
    <section id="controls" aria-label="操作面板">
      <h2>動作</h2>
      <div id="error" class="error" hidden></div>
      <div id="controls-body"></div>
    </section>
  </aside>
</main>
<div id="lobby-overlay" hidden>
  <div id="lobby-panel">
    <h2>等候大廳</h2>
    <div id="lobby-error" class="error" hidden></div>
    <div class="lobby-nick-row">
      <label for="myname-input">我的名稱</label>
      <input id="myname-input" type="text" placeholder="大廳顯示名稱（可隨時改）" maxlength="12" autocomplete="off">
      <button id="myname-btn" type="button" class="btn-small">改名</button>
    </div>
    <div class="lobby-grid">
      <section class="lobby-zone" aria-label="參戰區">
        <h3>⚔️ 參戰區 <span id="lobby-count" class="lobby-count"></span></h3>
        <div id="lobby-seats"></div>
        <p class="hint">按「參戰」自動配位加入；想休息就按自己座位的「離座」去觀戰，隨時回來。</p>
      </section>
      <section class="lobby-zone" aria-label="觀戰區">
        <h3>👀 觀戰區 <span id="lobby-spec-count" class="lobby-count"></span></h3>
        <div id="lobby-spectators" class="lobby-spectators"></div>
        <div id="lobby-spectate-row">
          <button id="spectate-btn" type="button" class="btn-ghost btn-small" hidden>轉為觀戰</button>
          <span id="lobby-watch-hint" class="hint">點左方空位就能加入參戰。</span>
        </div>
        <div class="lobby-chat">
          <h4>💬 大廳聊天</h4>
          <div id="lobby-chat-log" aria-live="polite"></div>
          <div class="lobby-chat-row">
            <input id="lobby-chat-input" type="text" placeholder="打招呼或聊戰術…（Enter 發送，上限 500 字）" maxlength="500" autocomplete="off">
            <button id="lobby-chat-send" type="button" class="btn-small">發送</button>
          </div>
          <div id="lobby-chat-count" class="hint">0 / 500</div>
        </div>
      </section>
      <section class="lobby-zone lobby-control" aria-label="控制列">
        <h3>⚙️ 開局設定</h3>
        <div id="lobby-host-controls">
          <div class="lobby-count-row">
            <label for="lobby-player-count">遊玩人數</label>
            <select id="lobby-player-count"></select>
            <label class="lobby-random"><input id="lobby-random" type="checkbox"> 隨機人數</label>
            <span id="lobby-random-hint" class="hint" hidden></span>
          </div>
          <div class="lobby-start-row">
            <button id="start-btn" type="button" class="btn-primary">開始遊戲</button>
            <span id="lobby-start-hint" class="hint"></span>
          </div>
        </div>
        <div id="lobby-guest-note" class="hint" hidden>房主正在設定人數，坐好準備開打！</div>
        <div id="lobby-engine" class="lobby-engine">
          <span id="lobby-engine-dot" class="engine-dot" aria-hidden="true"></span>
          <span id="lobby-engine-text">引擎準備中…</span>
        </div>
      </section>
    </div>
    <p class="hint">選好座位後由房主按開始遊戲；沒人入座時按開始即開純 AI 局。</p>
    <div id="name-mask" hidden>
      <div id="name-mask-box">
        <h3>先取個名字吧</h3>
        <p class="hint">進大廳前先取名，之後可隨時在「我的名稱」更改。</p>
        <div class="lobby-nick-row">
          <input id="name-mask-input" type="text" placeholder="取個暱稱吧（12 字內）" maxlength="12" autocomplete="off">
          <button id="name-mask-btn" type="button" class="btn-primary btn-small">進入大廳</button>
        </div>
        <div id="name-mask-error" class="error" hidden></div>
      </div>
    </div>
  </div>
</div>
<div id="disconnect-overlay" hidden>
  <div>
    <p id="disconnect-text">與伺服器斷線，重新連線中…</p>
  </div>
</div>
<script src="/js/main.js"></script>
</body>
</html>
